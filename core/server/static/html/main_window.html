<!DOCTYPE html>
<html data-client="main_window" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizMaster</title>
  <link href="/core/assets/images/icon.ico" rel="icon" type="image/x-icon">
